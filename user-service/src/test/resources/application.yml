spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service-group-test

eureka:
  client:
    enabled: false

jwt:
  secret: "test-secret-key-for-unit-tests-only-not-for-production-use"
  issuer: ecommerce-auth-service
