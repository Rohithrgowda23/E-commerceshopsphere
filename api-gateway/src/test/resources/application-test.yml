spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:9999
          predicates:
            - Path=/api/auth/**

eureka:
  client:
    enabled: false

jwt:
  secret: "test-secret-key-for-unit-tests-only-not-for-production-use"
  issuer: ecommerce-auth-service

security:
  public-endpoints:
    - /api/auth/register
    - /api/auth/login
